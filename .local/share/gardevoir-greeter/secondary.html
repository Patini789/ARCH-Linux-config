<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gardevoir Shiny (Pantalla secundaria)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bg-layer"></div>
    <div id="overlay-layer"></div>
    <canvas id="particles-canvas"></canvas>

    <div class="top-bar">
        <div id="clock">00:00</div>
        <div id="date">Viernes, 28 de Agosto</div>
    </div>

    <!-- Sin llamadas a lightdm: la autenticacion vive SOLO en la ventana primaria -->
    <script src="particles.js"></script>
    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('es-ES', options);
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
