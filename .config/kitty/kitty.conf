# Tipografía
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

# Optimizaciones de latencia y 165 Hz
repaint_delay    6
input_delay      2
sync_to_monitor  yes

# Ventana y dimensiones instantáneas
remember_window_size  no
initial_window_width   1100
initial_window_height  700
window_padding_width  12

# Colores y Opacidad (Catppuccin / Gardevoir Dark)
background_opacity 0.90
background       #1e1e2e
foreground       #cdd6f4
selection_background #89dceb
selection_foreground #1e1e2e

# Cursor
cursor           #00d4d4
cursor_shape     beam
cursor_beam_thickness 1.5

# Comportamientos
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0
