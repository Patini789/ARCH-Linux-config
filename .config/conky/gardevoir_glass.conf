conky.config = {
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 155,
    own_window_colour = '#060a12',
    own_window_class = 'Conky',
    own_window_title = 'GardevoirAestheticWidget',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    double_buffer = true,
    update_interval = 1.0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,

    use_xft = true,
    font = 'Inter:size=11',
    xftalpha = 1.0,
    text_buffer_size = 2048,
    uppercase = false,

    alignment = 'top_right',
    gap_x = 50,
    gap_y = 45,
    minimum_width = 340,
    maximum_width = 380,

    border_inner_margin = 18,
    border_outer_margin = 0,
    draw_borders = true,
    border_width = 1,
    draw_shades = true,
    default_shade_color = '#000000',
    draw_outline = false,
    draw_graph_borders = false,

    default_color = '#FFFFFF',
    color0 = '#1a2738',
    color1 = '#019cfb',
    color2 = '#FFFFFF',
    color3 = '#CBD5E1',
    color4 = '#FF4370',
};

conky.text = [[
${alignc}${font Press Start 2P:size=38}${color1}${time %H}${color2}:${time %M}${font}
${voffset 10}${alignc}${font Inter:weight=Bold:size=15}${color3}${execi 1800 LC_TIME=es_ES.UTF-8 date +'%A, %-d de %B' | sed 's/.*/\u&/'}${font}
${voffset 10}${color1}${hr 1}
${voffset 8}${font JetBrainsMono Nerd Font:size=10}${alignc}${color4}󰻠 ${color2}CPU ${color1}${cpu cpu0}%    ${color4}󰍛 ${color2}RAM ${color1}${memperc}%    ${color4}󰅐 ${color2}${uptime_short}${font}
${voffset 5}${font JetBrainsMono Nerd Font:size=10}${alignc}${color4}󰢮 ${color2}GPU ${color1}${execi 2 nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits}%    ${color4}󰘚 ${color2}VRAM ${color1}${execi 2 bash -c 'IFS=", " read -r u t <<< "$(nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader,nounits 2>/dev/null)"; echo "$(( u * 100 / t ))%"'}${font}
]];
